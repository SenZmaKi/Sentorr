</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.iso{--sv-glass:#0a0a0a;--sv-glow:#1c1c1c;--sv-pic:#5c5c5c;--sv-sun:#a8a8a8;--sv-bar:#404040;--sv-cached:#858585;--sv-played:#e6e6e6;--sv-power:#e6e6e6}

/* Explorer: the panel, stage tracker, legend and notes around a figure.
   Every colour is an anatomy token, so light and dark both work. */
.ex-icon{width:16px;height:16px;flex:none;display:block}
.ex-panel,.ex-legend,.ex-notes{margin-top:14px;font-size:13px;line-height:1.5;color:var(--anatomy-text)}

.ex-transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--anatomy-faint);background:var(--anatomy-page)}
.ex-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:500;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-lo);border-radius:8px;padding:6px 11px;cursor:pointer;transition:border-color .15s,background .15s}
.ex-btn:hover{border-color:var(--anatomy-mid)}
.ex-btn[aria-pressed="true"]{border-color:var(--anatomy-hi);background:var(--anatomy-face)}
.ex-primary{background:var(--anatomy-strong);color:var(--anatomy-card);border-color:var(--anatomy-strong)}
.ex-primary:hover{border-color:var(--anatomy-strong);opacity:.9}
.ex-ghost{border-color:transparent;background:none;color:var(--anatomy-text)}
.ex-phase{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;border:1px solid var(--anatomy-faint);color:var(--anatomy-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-phase:empty{display:none}
.ex-phase::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--anatomy-mid)}
.ex-phase[data-tone="ok"]::before{background:var(--anatomy-green)}
.ex-phase[data-tone="wait"]::before{background:var(--anatomy-red);animation:ex-pulse 1s ease-in-out infinite}
.ex-phase[data-tone="idle"]::before{background:var(--anatomy-lo)}
@keyframes ex-pulse{50%{opacity:.35}}

/* Segmented controls */
.ex-seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--anatomy-lo);border-radius:8px;background:var(--anatomy-card)}
.ex-seg>.ex-icon{margin:0 4px 0 6px;color:var(--anatomy-muted)}
.ex-seg label{position:relative;cursor:pointer}
.ex-seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ex-seg span{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.ex-seg input:checked+span{background:var(--anatomy-strong);color:var(--anatomy-card)}
.ex-seg input:focus-visible+span{outline:2px solid var(--anatomy-mid);outline-offset:1px}

/* Layout */
.ex-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.ex-col{min-width:0}
.ex-col+.ex-col{border-left:1px solid var(--anatomy-faint)}
@media (max-width:820px){.ex-grid{grid-template-columns:1fr}.ex-col+.ex-col{border-left:0;border-top:1px solid var(--anatomy-faint)}}
.ex-col>section{padding:14px 16px}

/* Headings */
.ex-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.ex-head>.ex-icon{width:30px;height:30px;padding:7px;border-radius:8px;background:var(--anatomy-page);border:1px solid var(--anatomy-faint);color:var(--anatomy-strong)}

.ex-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--anatomy-faint);color:var(--anatomy-muted);white-space:nowrap}
.ex-badge .ex-icon{width:12px;height:12px}

/* Controls */
.ex-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px}
.ex-control{min-width:0}
.ex-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ex-label{display:inline-flex;align-items:center;gap:6px;color:var(--anatomy-strong);font-weight:500}
.ex-label .ex-icon{color:var(--anatomy-muted)}

.ex-reset{display:inline-grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:6px;background:none;color:var(--anatomy-muted);cursor:pointer;visibility:hidden}
.ex-reset:hover{color:var(--anatomy-strong);background:var(--anatomy-page)}
.ex-reset .ex-icon{width:14px;height:14px}
.ex-control[data-changed] .ex-reset,.ex-reset-section{visibility:visible}
.ex-help{margin:6px 0 0;color:var(--anatomy-muted);font-size:12px}
.ex-control select{width:100%;font:inherit;color:var(--anatomy-strong);background:var(--anatomy-page);border:1px solid var(--anatomy-lo);border-radius:8px;padding:6px 8px;cursor:pointer}
.ex-control input[type=range]{--fill:50%;width:100%;height:18px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.ex-control input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--anatomy-hi) var(--fill),var(--anatomy-lo) var(--fill))}

.ex-stages ol{list-style:none;margin:0;padding:0;position:relative}

/* Notes */
.ex-notes{border:1px solid var(--anatomy-faint);border-radius:12px;background:var(--anatomy-card)}
.ex-notes summary{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;color:var(--anatomy-strong);font-weight:500;list-style:none}
.ex-notes summary::-webkit-details-marker{display:none}
.ex-notes summary .ex-icon:last-child{margin-left:auto;transition:transform .2s;color:var(--anatomy-muted)}
.ex-notes[open] summary .ex-icon:last-child{transform:rotate(180deg)}
.ex-notes ul{margin:0;padding:0 16px 12px 36px;color:var(--anatomy-text)}
.ex-notes li+li{margin-top:4px}

.iso-stage [data-key]{transition:opacity .2s}
.iso-stage[data-focus] [data-key]{opacity:.18}

ass="ex-col"><section class="ex-stats" aria-label="Live values"><header class="ex-head"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg><div><h3>Live</h3><p>Read from the running model</p></div></header><dl><div class="ex-stat" data-stat-tile="position"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg><dt>Position</dt><dd data-stat="position">–</dd></div><div class="ex-stat" data-stat-tile="cache"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2" /><line x1="12" x2="15" y1="14" y2="11" /><circle cx="12" cy="14" r="8" /></svg><dt>mpv cache</dt><dd data-stat="cache">–</dd><p>Starts at 2 s, reads to 60 s</p></div><div class="ex-stat" data-stat-tile="speed"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></svg><dt>Downloading</dt><dd data-stat="speed">–</dd></div><div class="ex-stat" data-stat-tile="busy"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg><dt>Peers busy</dt><dd data-stat="busy">–</dd></div><div class="ex-stat" data-stat-tile="verified"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><dt>Verified</dt><dd data-stat="verified">–</dd></div><div class="ex-stat" data-stat-tile="urgent"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></svg><dt>Urgent window</dt><dd data-stat="urgent">–</dd><p>About 8 s of video</p></div><div class="ex-stat" data-stat-tile="step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4" /><path d="M12 14v-4" /><path d="M4 13a8 8 0 0 1 8-7 8 8 0 1 1-5.3 14L4 17.6" /><path d="M9 17H4v5" /></svg><dt>Deadline spacing</dt><dd data-stat="step">–</dd><p>Playback in one piece</p></div><div class="ex-stat" data-stat-tile="ratio"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></svg><dt>Swarm vs bitrate</dt><dd data-stat="ratio">–</dd><p>Below 1× it must stall</p></div></dl></section><section class="ex-stages" aria-label="How it works"><header class="ex-head"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></svg><div><h3>How it works</h3><p>The lit step is what the model is doing now</p></div></header><ol><li data-stage="urgent"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></svg><b>1</b></span><div><strong>Fill the urgent window</strong><p>mpv's read waits on the first missing piece. The engine marks it and the next ones, <span data-stat="urgent"></span>, top priority with deadlines <span data-stat="step"></span> apart, and holds the download-ahead window back. The fastest peers take the soonest deadlines.</p></div></li><li data-stage="hold"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3" /></svg><b>2</b></span><div><strong>Play while holding</strong><p>Once 2 s are cached mpv starts. The hold stays on until the player has read an unbroken urgent run since the seek, so every peer keeps feeding playback.</p></div></li><li data-stage="ahead"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v8" /><path d="m16 6-4 4-4-4" /><rect width="20" height="8" x="2" y="14" rx="2" /><path d="M6 18h.01" /><path d="M10 18h.01" /></svg><b>3</b></span><div><strong>Download ahead</strong><p>The hold is released. Peers not needed by the urgent window fill pieces up to <span data-stat="ahead"></span> past the playhead, rarest first, out of order.</p></div></li><li data-stage="steady"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><b>4</b></span><div><strong>Steady</strong><p>Everything wanted is verified, so peers park. mpv keeps reading up to 60 s ahead of the playhead.</p></div></li><li data-stage="stall"><span class="ex-step"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14" /><path d="M5 2h14" /><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" /><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" /></svg><b>5</b></span><div><strong>Stall and recover</strong><p>If the cache empties, mpv pauses (buffering) and resumes at 2 s. A seek cancels stale reads, keeps verified pieces and starts again at step 1.</p></div></li></ol></section></div></div></div><section class="ex-legend" aria-label="Parts of the machine"><header class="ex-head"><svg class="ex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></svg><div><h3>Parts of the machine</h3><p>Hover or press a part to light it in the figure</p></div></header><ul><li><button type="button" class="ex-part" data-key="reader" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg ex-thumb" viewBox="0 0 96 64" aria-hidden="true"><g data-key="pieces"><path class="iso-halo" d="M-45.6 19.7L-45.4 19L-36.7 2.9L-36.2 2.3L-35.5 1.7L-34.6 1.2L-33.5 0.8L-32.3 0.5L-31.1 0.4L-29.8 0.4L-28.5 0.5L347.3 57.6L348.5 57.9L349.6 58.2L350.6 58.7L351.3 59.3L351.8 59.9L352.1 60.6L352.1 61.3L352.1 61.4L351.9 62L343.1 78.2L342.7 78.8L342 79.4L341.1 79.9L340 80.3L338.8 80.6L337.5 80.7L336.2 80.7L335 80.6L-40.9 23.5L-42.1 23.2L-43 // Torrent streaming, as Sentorr's engine schedules it. The rules and fixed
// numbers are the engine's own (packages/torrent_stream, lib/player/stream);
// the film, its pieces and the swarm are the reader's to configure.

const SOCKETS = 36; // pieces the tray can hold
const MAX_PEERS = 6;
// media_kit_adapter.dart: mpv starts after 2 s of cache and reads 60 s ahead.
const READY_S = 2;
const CACHE_S = 60;
// A player that stops reading for 3 s releases the start hold; one that has
// read a contiguous urgent window since the seek releases it too.
const IDLE_S = 3;
// How a swarm's speed splits over its connections: some peers are faster.
const SHARE = [0.25, 0.2, 0.17, 0.15, 0.13, 0.1];
const MIB = 1024 * 1024;

const DEFAULTS = {
  mbps: 10, // film bitrate, Mbit/s
  pieceMiB: 2,
  lengthS: 60,
  peers: 6,
  swarmMBps: 3, // all peers together, MB/s
  aheadMin: 10, // 0 downloads the entire file while it is open
};

/** Everything that follows from a configuration. */
function derive(input) {
  const c = { ...DEFAULTS, ...input };
  const PIECE = c.pieceMiB * MIB;
  const RATE = (c.mbps * 1e6) / 8;
  const PIECE_S = PIECE / RATE;
  const maxLength = SOCKETS * PIECE_S;
  const LENGTH_S = Math.min(Math.max(c.lengthS, PIECE_S), maxLength);
  const N = Math.min(SOCKETS, Math.max(1, Math.ceil(LENGTH_S / PIECE_S - 1e-9)));
  // torrent_bytes.dart: about 8 s of video is time-critical, 2–64 MiB, ≤ 16 pieces.
  const URGENT_BYTES = Math.min(64 * MIB, Math.max(2 * MIB, RATE * 8));
  const URGENT = Math.min(16, Math.max(1, Math.ceil(URGENT_BYTES / PIECE)));
  // Deadlines are spaced by the playback each piece holds, 100–4000 ms.
  const STEP_MS = Math.min(4000, Math.max(100, Math.floor((PIECE * 1000) / RATE)));
  const weights = SHARE.slice(0, c.peers);
  const total = weights.reduce((a, b) => a + b, 0);
  const PEERS = weights.map((w) => (w / total) * c.swarmMBps * 1e6);
  return { ...c, PIECE, RATE, PIECE_S, maxLength, LENGTH_S, N, URGENT_BYTES, URGENT, STEP_MS, PEERS };
}

// Fixed rarity, so background pieces arrive rarest-first, out of order.
const RARITY = Array.from({ length: SOCKETS }, (_, i) => ((i * 7919 + 13) % 97) / 97);

function create(config) {
  const c = derive(config);
  return {
    c,
    have: new Float64Array(c.N),
    pos: 0,
    phase: "starting", // starting | playing | buffering | ended
    paused: false,
    starting: true, // the engine's start hold: disk window held back
    from: 0, // the piece the hold's contiguous run starts at
    quiet: 0, // seconds the player has not read during the hold
    clearing: 0,
    heads: Array.from({ length: MAX_PEERS }, (_, i) => ({ x: parkOf(i), rate: c.PEERS[i] ?? 0, piece: -1, busy: false })),
  };

/** Changes the swarm without touching the film: peers and speed apply live. */
function retune(s, config) {
  s.c = derive({ ...s.c, ...config });
  s.heads.forEach((head, i) => (head.rate = s.c.PEERS[i] ?? 0));
}

// Idle heads park past the tray's end, so the fastest peers (lowest index)
// always take the soonest deadlines.
const parkOf = (i) => SOCKETS + 0.6 + i;
const pieceAt = (s, seconds) => Math.min(s.c.N - 1, Math.max(0, Math.floor(seconds / s.c.PIECE_S + 1e-9)));

function firstMissing(s, from) {
  for (let i = from; i < s.c.N; i++) if (s.have[i] < 1) return i;
  return s.c.N;
}

/** Seconds of verified, contiguous media ahead of the position (mpv's cache). */
function cacheOf(s) {

/** The pieces the peers work on: deadlines first, then rarest-first. */

    kit.dotsSvg([kit.iso([x + 0.3, TRAY.y + 3, TRAY_TOP + 9], P), kit.iso([x + 0.3, TRAY.y + TRAY.d - 3, TRAY_TOP + 9], P)], { size: 0.4 }),

}

/**
 * mpv's cache as a strip on the ruler: from the playhead slider's front face
 * to the end of the verified run, at most 60 s. A tab rides [READY_S] ahead
 * of the position: playback starts or resumes once the strip passes it.
 * Positions are in seconds; [pieceS] is the playback each piece holds.

function stripSvg(kit, P, pos, cache, pieceS) {
  const xAt = (t) => X0 + (t / pieceS) * PITCH;
  const from = xAt(pos) + 3;
  const to = xAt(pos + cache);
  const out = [];
  if (to - from > 0.3) {
    out.push(kit.solidSvg(kit.slabOf({ x: from, y: LANE.y, w: to - from, d: LANE.d, r: 0.4 }, 0.6, 0.5, P, 2, 0.2), { tone: "hi", crease: "lo" }));
  }
  const tab = xAt(pos + READY_S);
  out.push(kit.solidSvg(kit.slabOf({ x: tab - 0.5, y: LANE.y - 0.5, w: 1, d: LANE.d + 1, r: 0.3 }, 0.6, 1.6, P, 2, 0.2), { tone: "mid" }));
  return out.join("");
}

const P = {"origin":[346.4231119836347,146.2880656925508],"scale":1.0073071432352938,"azimuth":74,"elevation":32};
const PRESETS = {"healthy":{},"slow":{"swarmMBps":1,"peers":3},"remux":{"mbps":40,"pieceMiB":16,"swarmMBps":8,"lengthS":600},"lone":{"peers":1,"swarmMBps":1.6},"whole":{"aheadMin":0},"small":{"pieceMiB":1,"mbps":16}};
// The page's script. The build prepends the kit, the explorer runtime,
// model.mjs, layout.mjs and shapes.mjs (exports stripped), `P` and `PRESETS`.
const kit = { slabOf, solidSvg, lineOnTop, lineSvg, dotsSvg, iso };
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const q = (sel) => svg.querySelector(sel);
const all = (sel, root = svg) => [...root.querySelectorAll(sel)];
const blocks = all('[data-part="block"]');
const headEls = all('[data-part="head"]');
const filaments = all('[data-part="filament"]');
const lamps = all('[data-part="lamp"]');
const carriage = q('[data-part="carriage"]'), comb = q('[data-part="comb"]'), lid = q('[data-part="lid"]');
const playheadEl = q('[data-part="playhead"]'), strip = q('[data-part="strip"]');
const picture = q('[data-part="picture"]'), sun = q('[data-part="sun"]'), spinner = q('[data-part="spinner"]');
const cached = q('[data-part="cached"]'), played = q('[data-part="played"]'), screenHead = q('[data-part="screen-head"]');
const dots = all("circle", spinner);
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const BAR_FROM = CRT.x0 + 3, BAR_TO = CRT.x1 - 3, BAR_Z = CRT.z0 + 2.6;

let s = create(DEFAULTS);
seek(s, 0);
let drawn = [], teeth = [], speed = 1, clock = 0, next = 0, touring = !still.matches;
let frame = 0, last = 0, visible = false, spin = 0, statsAt = 0;

// The tour walks every stage: start cold, seek ahead into missing pieces,
// seek back into verified ones, pause while peers keep downloading, close.
const TOUR = [
  [20, () => seek(s, 0.72 * s.c.LENGTH_S)],
  [31, () => seek(s, 0.22 * s.c.LENGTH_S)],
  [39, () => (s.paused = true)],
  [44, () => (s.paused = false)],
  [56, () => reset(s)],
];
const LOOP = 57;

const fmt = Explorer.fmtDuration;
const secs = (t) => (t < 10 ? t.toFixed(2) : t.toFixed(1)) + " s";
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function rebuild() {
  drawn = new Array(SOCKETS).fill(-1);
  comb.innerHTML = combSvg(kit, P, s.c.URGENT);
  teeth = all('[data-part="tooth"]', comb);
  lid.innerHTML = lidSvg(kit, P, s.c.N);
}

function phase() {
  if (s.clearing > 0) return ["closing", "idle"];
  if (s.phase === "ended") return ["ended", "idle"];
  if (s.phase === "buffering") return ["buffering", "wait"];
  if (s.phase === "starting") return ["starting", "wait"];
  return s.paused ? ["paused", "idle"] : ["playing", "ok"];
}

/** Which of the algorithm's stages the model is in. */
function stageOf() {
  if (s.phase === "buffering") return "stall";
  if (s.phase === "starting" || s.clearing > 0) return "urgent";
  if (s.starting) return "hold";
  const w = windowsOf(s);
  for (let i = 0; i < s.c.N; i++) if (w.priority[i] > 0 && s.have[i] < 1) return "ahead";
  return "steady";
}

function report() {
  const c = s.c;
  const cache = cacheOf(s);
  const verified = s.have.filter((h) => h >= 1).length;
  const busy = s.heads.filter((h, i) => i < c.peers && h.busy).length;
  ex.setStats({
    position: `${fmt(s.pos)} / ${fmt(c.LENGTH_S)}`,
    cache: `${cache.toFixed(1)} s`,
    speed: `${(speedOf(s) / 1e6).toFixed(1)} MB/s`,
    busy: `${busy} of ${c.peers}`,
    verified: `${verified} / ${c.N}`,
    urgent: `${plural(c.URGENT, "piece")} · ${secs(c.URGENT * c.PIECE_S)}`,
    step: secs(c.STEP_MS / 1000),
    ratio: `${(c.swarmMBps / (c.RATE / 1e6)).toFixed(1)}×`,
    piece: `${c.pieceMiB} MiB, ${secs(c.PIECE_S)} each`,
    ahead: c.aheadMin > 0 ? `${c.aheadMin} min` : "the entire file",
  });
  const [word, tone] = phase();
  ex.setPhase(word, tone);
  ex.setStage(stageOf());
  ex.setPlaying(!s.paused);
  ex.setTouring(touring);
}

function draw(dt) {
  for (let i = 0; i < SOCKETS; i++) {
    const have = i < s.c.N ? s.have[i] : 0;
    const f = have >= 1 ? 1 : Math.round(have * 40) / 40;
    if (f !== drawn[i]) { drawn[i] = f; blocks[i].innerHTML = blockSvg(kit, P, i, f); }
  }
  s.heads.forEach((h, i) => {
    const live = i < s.c.peers;
    headEls[i].setAttribute("display", live ? "inline" : "none");
    headEls[i].setAttribute("transform", translateAlong(P, [cellX(h.x), 0, 0]));
    lamps[i].toggleAttribute("data-on", live && h.busy);
    lamps[i].toggleAttribute("data-off", !live);
    const on = live && h.busy && drawn[h.piece] > 0 && drawn[h.piece] < 1;
    filaments[i].setAttribute("display", on ? "inline" : "none");
    if (on) {
      const [x, y] = iso([cellX(h.x), NOZZLE_Y, TRAY_TOP + Math.max(0.3, drawn[h.piece] * BLOCK_H)], P);
      filaments[i].querySelector("path").setAttribute("d", pathOf([iso([cellX(h.x), NOZZLE_Y, TIP_Z], P), [x, y]]));
      const dot = filaments[i].querySelector("circle");
      dot.setAttribute("cx", x.toFixed(2));
      dot.setAttribute("cy", y.toFixed(2));
    }
  });
  const reader = readerOf(s);
  carriage.setAttribute("transform", translateAlong(P, [cellX(reader), 0, 0]));
  teeth.forEach((el, i) => el.setAttribute("display", reader + i < s.c.N ? "inline" : "none"));
  playheadEl.setAttribute("transform", translateAlong(P, [X0 + (s.pos / s.c.PIECE_S) * PITCH, 0, 0]));
  const cache = cacheOf(s);
  const stripKey = `${s.pos.toFixed(2)}:${cache.toFixed(2)}:${s.c.PIECE_S}`;
  if (strip.dataset.at !== stripKey) { strip.dataset.at = stripKey; strip.innerHTML = stripSvg(kit, P, s.pos, cache, s.c.PIECE_S); }
  const share = (t) => (BAR_FROM + (t / s.c.LENGTH_S) * (BAR_TO - BAR_FROM)).toFixed(2);
  played.setAttribute("d", `M${BAR_FROM} ${-BAR_Z}H${share(s.pos)}`);
  cached.setAttribute("d", `M${share(s.pos)} ${-BAR_Z}H${share(s.pos + cache)}`);
  screenHead.setAttribute("cx", share(s.pos));
  sun.setAttribute("cx", (CRT.x0 + 6 + (s.pos / s.c.LENGTH_S) * (CRT.x1 - CRT.x0 - 12)).toFixed(2));
  const waiting = (s.phase === "starting" || s.phase === "buffering") && s.clearing <= 0;
  spin += dt;
  picture.style.opacity = waiting ? "0.35" : s.paused ? "0.7" : "1";
  spinner.style.opacity = waiting ? "1" : "0";
  dots.forEach((d, i) => (d.style.opacity = String(0.35 + 0.65 * Math.max(0, Math.sin(spin * 4 - i * 0.9)))));
  const text = `${phase()[0]} · ${fmt(s.pos)} · cache ${cache.toFixed(1)} s · ${(speedOf(s) / 1e6).toFixed(1)} MB/s`;
  if (readout.textContent !== text) readout.textContent = text;
}

function advance(dt) {
  if (touring) {
    clock += dt;
    while (next < TOUR.length && clock >= TOUR[next][0]) TOUR[next++][1]();
    if (clock >= LOOP) { clock = 0; next = 0; }
  }
  step(s, dt);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  // Faster simulation runs in steps no longer than a frame.
  const n = Math.ceil(speed);
  for (let i = 0; i < n; i++) advance((dt * speed) / n);
  draw(dt);
  if (now - statsAt > 120) { statsAt = now; report(); }
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
// Reduced motion: no tour; each change jumps the bench 12 s of film ahead.
function settle() {
  for (let i = 0; i < 12 * 30; i++) advance(1 / 30);
  s.heads.forEach((h, i) => (h.x = h.piece >= 0 ? h.piece : parkOf(i)));
  draw(0);
  report();
}
function describe() {
  stage.setAttribute("aria-valuemax", String(s.c.N - 1));
  stage.setAttribute("aria-valuenow", String(pieceAt(s, s.pos)));
  stage.setAttribute("aria-valuetext", `${phase()[0]} at piece ${pieceAt(s, s.pos) + 1} of ${s.c.N}, ${cacheOf(s).toFixed(0)} seconds cached`);
}
/** Every reader action stops the tour; the Tour button brings it back. */
function steer(action) {
  touring = false;
  action();
  describe();
  if (still.matches) settle();
  else report();
  run();
}
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

const centres = Array.from({ length: SOCKETS }, (_, i) => iso([cellX(i), 0, TRAY_TOP], P));
function pieceUnder(event) {
  const m = svg.getScreenCTM();
  if (!m) return null;
  const p = new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse());
  let best = 0, gap = Infinity;
  centres.forEach(([x, y], i) => { const d = Math.hypot(x - p.x, (y - p.y) * 0.6); if (d < gap) { gap = d; best = i; } });
  return gap < 60 ? Math.min(best, s.c.N - 1) : null;
}
const jump = () => Math.max(10, s.c.PIECE_S);
stage.addEventListener("click", (event) => { const i = pieceUnder(event); if (i !== null) steer(() => seek(s, i * s.c.PIECE_S)); });
stage.addEventListener("keydown", (event) => {
  const keys = {
    ArrowRight: () => seek(s, s.pos + jump()), ArrowUp: () => seek(s, s.pos + jump()),
    ArrowLeft: () => seek(s, s.pos - jump()), ArrowDown: () => seek(s, s.pos - jump()),
    Home: () => seek(s, 0), End: () => seek(s, s.c.LENGTH_S - jump()),
    " ": () => (s.paused = !s.paused), Enter: () => (s.paused = !s.paused),
    Escape: () => reset(s),
  };
  if (!keys[event.key]) return;
  event.preventDefault();
  steer(keys[event.key]);
});

// The explorer. Network and the setting apply live; a new film starts over.
const LIVE = new Set(["swarmMBps", "peers", "aheadMin"]);
// A preset's length is applied after the slider's range widens to fit it.
let pendingLength = null;
const ex = Explorer.mount(document.querySelector("[data-explorer]"), {
  presets: PRESETS,
  onChange(changed, values) {
    const film = Object.keys(changed).some((name) => !LIVE.has(name));
    if ("mbps" in changed || "pieceMiB" in changed || pendingLength !== null) fitLength(values);
    steer(() => {
      if (film) { s = create(values); seek(s, 0); rebuild(); }
      else retune(s, values);
    });
  },
  onAction(act, value) {
    if (act === "speed") { speed = value; return; }
    if (act === "preset") { pendingLength = PRESETS[value]?.lengthS ?? DEFAULTS.lengthS; return; }
    if (act === "defaults") { pendingLength = DEFAULTS.lengthS; return; }
    if (act === "tour") {
      touring = !touring;
      clock = 0; next = 0;
      if (touring) reset(s);
      report();
      return run();
    }
    const acts = {
      play: () => (s.paused = !s.paused),
      restart: () => reset(s),
      back: () => seek(s, s.pos - jump()),
      ahead: () => seek(s, s.pos + jump()),
      middle: () => seek(s, s.c.LENGTH_S / 2),
      close: () => reset(s),
    };
    if (acts[act]) steer(acts[act]);
  },
});
/** The length slider's range follows what the tray holds at this bitrate and piece size. */
function fitLength(values) {
  const c = derive(values);
  const wanted = pendingLength ?? values.lengthS;
  ex.setRange("lengthS", { min: c.PIECE_S, max: c.maxLength, step: "any" });
  ex.set("lengthS", Math.min(wanted, c.maxLength));
  pendingLength = null;
}
Explorer.legend(document.querySelector(".ex-legend ul"), stage);

fitLength(ex.values);
rebuild();
if (still.matches) { touring = false; settle(); seek(s, 0.72 * s.c.LENGTH_S); settle(); }
draw(0);
report();
describe();

}</script></body></html>

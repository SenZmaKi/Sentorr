name: sentorr
description: Sentorr application domain and infrastructure.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  path: ^1.9.1
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  screen_retriever: ^0.2.0
  tray_manager: ^0.7.0
  launch_at_startup: ^0.5.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  file: ^7.0.1
  cryptography: ^2.7.0
  pub_semver: ^2.2.0
  package_info_plus: ^9.0.0
  crypto: ^3.0.7
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  dio_http2_adapter: ^2.9.0
  http2: ^2.3.1
  http_cache_file_store: ^2.0.2
  logging: ^1.3.0
  html: ^0.15.7
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  anitomy_dart: ^1.0.1
  libtorrent_dart: ^1.1.0
  torrent_stream:
    path: packages/torrent_stream
  file_picker: ^9.2.1
  flutter_local_notifications: ^22.0.1
  # Senpwai's fork, which adds a progress bar to the service notification.
  flutter_foreground_task:
    git:
      url: https://github.com/SenZmaKi/flutter_foreground_task_progress
      ref: d45cc6313b8626edc7a61f8eb210ef6dd07b6284
  windows_taskbar: ^1.1.2
  flutter_secure_storage: ^10.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.26.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/sources/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # Inter's optical cut for large sizes: tighter spacing, finer details.
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500

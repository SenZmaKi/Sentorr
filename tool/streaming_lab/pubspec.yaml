name: streaming_lab
description: Sentorr torrent-backed MediaKit streaming experiment.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  sentorr:
    path: ../..
  libtorrent_dart: ^1.1.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_picker: ^9.2.1
  path_provider: ^2.1.6
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
